name: Actualiser et publier le journal de veille
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: veille-rss
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tester le collecteur
        run: python -m unittest discover -s scripts -p test_veille.py
      - name: Collecter les sources
        run: python scripts/update_veille.py
      - name: Construire le site
        run: node scripts/generate.mjs && node scripts/build.mjs
      - name: Enregistrer les publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/veille.json pages/veille.html
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser la veille technologique"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    if: vars.ENABLE_PAGES_DEPLOY == 'true'
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
